name: Publish signed APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os,re,pathlib
          tag=os.environ['RELEASE_TAG']
          version=re.search(r"versionName '([^']+)'",pathlib.Path('app/build.gradle').read_text()).group(1)
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',tag) or tag != 'v'+version:
              raise SystemExit('Release tag must match app versionName, for example v1.4.0')
          PY
      - name: Check and restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          required=['ANDROID_KEYSTORE_BASE64','ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD']
          if any(not os.environ.get(key) for key in required):
              raise SystemExit('Configure all four Android signing repository secrets before publishing.')
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'sms-forwarder-release.jks'
          key.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'],validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('ANDROID_KEYSTORE_PATH='+str(key)+'\n')
          PY
      - name: Test, lint and build signed release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify and package APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/sms-telegram-forwarder-${RELEASE_TAG}.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing key
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'sms-forwarder-release.jks').unlink(missing_ok=True)
          PY

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-release
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          原生 Android 短信转发到 Telegram，支持 Android 8.0+。

          在下方 Assets 下载 APK，SHA256SUMS 可用于校验文件。

          此 APK 由 GitHub Actions 使用固定正式密钥签名。后续正式版可覆盖升级。
          本机开发调试版使用不同签名，首次切换到正式版无法直接覆盖；卸载调试版会删除配置和本地记录，请先自行妥善保存所需信息。

          使用前需要配置 Telegram Bot Token / Chat ID，并按应用内引导开启短信权限。
          NOTES
          gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
